<g font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <pattern id="pets-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <!-- The canvas -->
  <path d="M0 0h540v388a16 16 0 0 1-16 16H16a16 16 0 0 1-16-16z" fill="#0b0e14"/>
  <path d="M0 0h540v388a16 16 0 0 1-16 16H16a16 16 0 0 1-16-16z" fill="url(#pets-dots)"/>

  <!-- A window in the back: a terminal -->
  <g opacity="0.75">
    <rect x="18" y="22" width="190" height="150" rx="10" fill="#121722" stroke="#262d3c"/>
    <path d="M18 54V32a10 10 0 0 1 10-10h170a10 10 0 0 1 10 10v22z" fill="#171d2a"/>
    <line x1="18" y1="54" x2="208" y2="54" stroke="#262d3c"/>
    <g fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M30 34l4 4-4 4M37 43h6"/></g>
    <text x="52" y="43" fill="#c9d1e0" font-weight="600">Terminal</text>
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="11">
      <text x="30" y="76"><tspan fill="#3fb950">~/my-app</tspan><tspan fill="#9aa3b6"> $ npm run dev</tspan></text>
      <text x="30" y="96" fill="#9aa3b6">VITE v6.3  ready in 212 ms</text>
      <text x="30" y="116"><tspan fill="#9aa3b6">➜  Local: </tspan><tspan fill="#58a6ff">localhost:5173</tspan></text>
      <rect x="30" y="128" width="7" height="13" fill="#9aa3b6"/>
    </g>
  </g>

  <!-- A note in the back -->
  <g opacity="0.75">
    <rect x="404" y="30" width="118" height="84" rx="10" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity="0.4"/>
