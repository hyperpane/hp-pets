    <text x="418" y="76" fill="#9aa3b6" font-size="11">counter: done</text>
    <text x="418" y="94" fill="#9aa3b6" font-size="11">dark mode: next</text>
  </g>

  <!-- The window you're working in: the cat naps on its header -->
