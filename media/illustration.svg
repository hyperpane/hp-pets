  <text x="144" y="170" fill="#f4f6fb" font-weight="600">Counter.tsx</text>
  <g stroke="#5d6678" stroke-width="1.4" stroke-linecap="round"><path d="M480 161l8 8M488 161l-8 8"/><circle cx="460" cy="165" r="1" fill="#5d6678"/><circle cx="465" cy="165" r="1" fill="#5d6678"/><circle cx="455" cy="165" r="1" fill="#5d6678"/></g>
  <g font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5">
    <text x="138" y="206" fill="#5d6678" text-anchor="end">1</text>
    <text x="154.0" y="206" fill="#ff7b72">import</text>
    <text x="202.4" y="206" fill="#c9d1e0">{ useState } </text>
    <text x="292.4" y="206" fill="#ff7b72">from</text>
    <text x="327.0" y="206" fill="#a5d6ff">'react'</text>
    <text x="375.4" y="206" fill="#9aa3b6">;</text>
    <text x="138" y="224" fill="#5d6678" text-anchor="end">2</text>
    <text x="138" y="242" fill="#5d6678" text-anchor="end">3</text>
    <text x="154.0" y="242" fill="#ff7b72">export function </text>
    <text x="264.7" y="242" fill="#d2a8ff">Counter</text>
    <text x="313.2" y="242" fill="#c9d1e0">() {</text>
    <text x="138" y="260" fill="#5d6678" text-anchor="end">4</text>
    <text x="167.8" y="260" fill="#ff7b72">const</text>
    <text x="209.4" y="260" fill="#c9d1e0">[n, setN] = </text>
    <text x="292.4" y="260" fill="#d2a8ff">useState</text>
    <text x="347.8" y="260" fill="#c9d1e0">(</text>
    <text x="354.7" y="260" fill="#ffa657">0</text>
    <text x="361.6" y="260" fill="#c9d1e0">);</text>
    <text x="138" y="278" fill="#5d6678" text-anchor="end">5</text>
    <text x="167.8" y="278" fill="#ff7b72">return</text>
    <text x="216.3" y="278" fill="#c9d1e0">(</text>
    <text x="138" y="296" fill="#5d6678" text-anchor="end">6</text>
    <text x="181.7" y="296" fill="#c9d1e0">&lt;</text>
    <text x="188.6" y="296" fill="#7ee787">button</text>
    <text x="237.0" y="296" fill="#79c0ff">onClick</text>
    <text x="285.5" y="296" fill="#c9d1e0">={() =&gt; </text>
    <text x="340.8" y="296" fill="#d2a8ff">setN</text>
    <text x="368.5" y="296" fill="#c9d1e0">(n + </text>
    <text x="403.1" y="296" fill="#ffa657">1</text>
    <text x="410.0" y="296" fill="#c9d1e0">)}&gt;</text>
    <text x="138" y="314" fill="#5d6678" text-anchor="end">7</text>
    <text x="195.5" y="314" fill="#c9d1e0">Clicked {n} times</text>
    <text x="138" y="332" fill="#5d6678" text-anchor="end">8</text>
    <text x="181.7" y="332" fill="#c9d1e0">&lt;/</text>
    <text x="195.5" y="332" fill="#7ee787">button</text>
    <text x="237.0" y="332" fill="#c9d1e0">&gt;</text>
    <text x="138" y="350" fill="#5d6678" text-anchor="end">9</text>
    <text x="167.8" y="350" fill="#c9d1e0">);</text>
    <text x="138" y="368" fill="#5d6678" text-anchor="end">10</text>
    <text x="154.0" y="368" fill="#c9d1e0">}</text>
  </g>

